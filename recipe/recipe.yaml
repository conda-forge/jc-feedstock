schema_version: 1

context:
  name: jc
  version: "1.26.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/jc-${{ version }}.tar.gz
  sha256: fdf1a58d05db351bd597438cf3b67ff7a9653cc0da4c63234ce77fe26051a4dc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - jc=jc.cli:main

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - python >=${{ python_min }}
    - ruamel.yaml >=0.15.0
    - xmltodict >=0.12.0
    - pygments >=2.3.0

tests:
  - python:
      imports:
        - jc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - jc --help

about:
  summary: Converts the output of popular command-line tools and file-types to JSON.
  license: MIT
  license_file:
    - LICENSE.md
  homepage: https://github.com/kellyjonbrazil/jc
  documentation: https://github.com/kellyjonbrazil/jc/tree/master/docs

extra:
  recipe-maintainers:
    - thewchan
